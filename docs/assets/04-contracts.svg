<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <defs>
    <linearGradient id="accentline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ed3d8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5ed3d8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="500" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1097" height="497" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="492" width="1100" height="4" fill="url(#accentline)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>

  <g stroke="#5ed3d8" fill="none" stroke-width="1.6" stroke-linecap="round">
    <rect x="101.5" y="13.5" width="19" height="18" rx="5.5"/>
    <circle cx="111" cy="19.6" r="2.2"/>
    <path d="M111 21.8 L111 26.6"/>
  </g>

  <text x="550" y="31" text-anchor="middle" font-size="13" fill="#8b949e">the contract surface on base — three solidity files, one mint signature</text>

  <!-- ICloneAgent -->
  <rect x="40" y="72" width="331" height="256" rx="12" fill="#161b22" stroke="#30363d"/>
  <rect x="52" y="72" width="307" height="3" rx="1.5" fill="#5ed3d8"/>
  <text x="56" y="102" font-size="14" font-weight="700" fill="#5ed3d8">ICloneAgent.sol</text>
  <text x="56" y="122" font-size="11" fill="#8b949e">the iNFT — one agent per token</text>
  <path d="M56 136 L355 136" stroke="#30363d" stroke-width="1"/>
  <g font-size="11" fill="#c9d1d9">
    <circle cx="60" cy="156" r="2" fill="#5ed3d8"/><text x="70" y="160">ERC-721A · ERC-2981 · ERC-6551</text>
    <circle cx="60" cy="180" r="2" fill="#5ed3d8"/><text x="70" y="184">mint(address to, string uri) payable</text>
    <circle cx="60" cy="204" r="2" fill="#5ed3d8"/><text x="70" y="208">per-token Irys tokenURI, on-chain</text>
    <circle cx="60" cy="228" r="2" fill="#5ed3d8"/><text x="70" y="232">setTokenURI(id, uri) — evolving art</text>
    <circle cx="60" cy="252" r="2" fill="#5ed3d8"/><text x="70" y="256">tokenAccount(id) — agent wallet</text>
    <circle cx="60" cy="276" r="2" fill="#5ed3d8"/><text x="70" y="280">tokenIds start at 1</text>
    <circle cx="60" cy="300" r="2" fill="#5ed3d8"/><text x="70" y="304">Ownable2Step · Pausable · guarded</text>
  </g>

  <!-- CloneForge -->
  <rect x="384" y="72" width="331" height="256" rx="12" fill="#161b22" stroke="#30363d"/>
  <rect x="396" y="72" width="307" height="3" rx="1.5" fill="#b18bf5"/>
  <text x="400" y="102" font-size="14" font-weight="700" fill="#b18bf5">CloneForge.sol</text>
  <text x="400" y="122" font-size="11" fill="#8b949e">configurable drop, deployed from the app</text>
  <path d="M400 136 L699 136" stroke="#30363d" stroke-width="1"/>
  <g font-size="11" fill="#c9d1d9">
    <circle cx="404" cy="156" r="2" fill="#b18bf5"/><text x="414" y="160">one Config struct — no Remix</text>
    <circle cx="404" cy="180" r="2" fill="#b18bf5"/><text x="414" y="184">curated: mint(to, uri) per item</text>
    <circle cx="404" cy="204" r="2" fill="#b18bf5"/><text x="414" y="208">drop: dropBaseURI + mintDrop(qty)</text>
    <circle cx="404" cy="228" r="2" fill="#b18bf5"/><text x="414" y="232">maxSupply · mintPrice · walletLimit</text>
    <circle cx="404" cy="252" r="2" fill="#b18bf5"/><text x="414" y="256">ogCard — OG holders only, if set</text>
    <circle cx="404" cy="276" r="2" fill="#b18bf5"/><text x="414" y="280">contractURI() — collection profile</text>
    <circle cx="404" cy="300" r="2" fill="#b18bf5"/><text x="414" y="304">support: None · FirstSale · Perpetual</text>
  </g>

  <!-- FrameRoyaltySplit -->
  <rect x="728" y="72" width="331" height="256" rx="12" fill="#161b22" stroke="#30363d"/>
  <rect x="740" y="72" width="307" height="3" rx="1.5" fill="#6fb7d9"/>
  <text x="744" y="102" font-size="14" font-weight="700" fill="#6fb7d9">FrameRoyaltySplit.sol</text>
  <text x="744" y="122" font-size="11" fill="#8b949e">the perpetual-support receiver</text>
  <path d="M744 136 L1043 136" stroke="#30363d" stroke-width="1"/>
  <g font-size="11" fill="#c9d1d9">
    <circle cx="748" cy="156" r="2" fill="#6fb7d9"/><text x="758" y="160">immutable two-payee ETH splitter</text>
    <circle cx="748" cy="180" r="2" fill="#6fb7d9"/><text x="758" y="184">ERC-2981 receiver when Perpetual</text>
    <circle cx="748" cy="204" r="2" fill="#6fb7d9"/><text x="758" y="208">creatorBps + devBps (1% to 5%)</text>
    <circle cx="748" cy="228" r="2" fill="#6fb7d9"/><text x="758" y="232">pull-only: release(payee)</text>
    <circle cx="748" cy="252" r="2" fill="#6fb7d9"/><text x="758" y="256">pending(payee) — what is owed</text>
    <circle cx="748" cy="276" r="2" fill="#6fb7d9"/><text x="758" y="280">no owner, no setters, no upgrade</text>
    <circle cx="748" cy="300" r="2" fill="#6fb7d9"/><text x="758" y="304">creator + dev capped at 10%</text>
  </g>

  <rect x="30" y="352" width="1040" height="64" rx="12" fill="#161b22" stroke="#30363d"/>
  <rect x="30" y="352" width="3" height="64" rx="1.5" fill="#5ed3d8" opacity="0.8"/>
  <g font-size="11.5">
    <text x="50" y="380" fill="#c9d1d9">foundry: solc 0.8.28 · optimizer 200 runs · evm cancun · OpenZeppelin v5 · ERC721A v4</text>
    <text x="50" y="402" fill="#8b949e">CI: forge fmt --check · forge build --sizes · forge test -vvv on every push to contracts/</text>
  </g>

  <text x="550" y="440" text-anchor="middle" font-size="13" fill="#8b949e">both NFT contracts share mint(address,string) — the app can point at either</text>
</svg>
