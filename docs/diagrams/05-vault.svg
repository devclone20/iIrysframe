<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 562" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img">
<title>iIrys Frame — Vault</title>
<desc>O tab Vault reconstrói o inventário a partir da Irys: consulta o GraphQL por owner e tags, agrupa por Item em pastas de coleção, permite navegar (capas, contagens, tiers) e agir (copiar tokenURI, cunhar).</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#57606e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="561" rx="14" fill="#0b0e14" stroke="#1b2230"/>
<circle cx="44" cy="26" r="4" fill="#2bb88a"/>
<text x="56" y="30" fill="#eaf0f7" font-size="14" font-weight="600">Vault — your sealed inventory</text>
<text x="56" y="49" fill="#8b95a7" font-size="12">rebuilt entirely from Irys, grouped by collection</text>
<rect x="190" y="86" width="300" height="56" rx="10" fill="#161b24" stroke="#38414f"/>
<text x="340" y="108" text-anchor="middle" dominant-baseline="central" fill="#d3dae4" font-size="14" font-weight="600">Irys GraphQL</text>
<text x="340" y="126" text-anchor="middle" dominant-baseline="central" fill="#8a94a6" font-size="12">by owner + tags</text>
<rect x="190" y="186" width="300" height="56" rx="10" fill="#1e1b37" stroke="#6a5fd0"/>
<text x="340" y="208" text-anchor="middle" dominant-baseline="central" fill="#cfc8ff" font-size="14" font-weight="600">Reconstruct</text>
<text x="340" y="226" text-anchor="middle" dominant-baseline="central" fill="#9890c8" font-size="12">inventory from Irys</text>
<rect x="190" y="286" width="300" height="56" rx="10" fill="#1e1b37" stroke="#6a5fd0"/>
<text x="340" y="308" text-anchor="middle" dominant-baseline="central" fill="#cfc8ff" font-size="14" font-weight="600">Group by Item</text>
<text x="340" y="326" text-anchor="middle" dominant-baseline="central" fill="#9890c8" font-size="12">→ Collection folders</text>
<rect x="190" y="386" width="300" height="56" rx="10" fill="#1e1b37" stroke="#6a5fd0"/>
<text x="340" y="408" text-anchor="middle" dominant-baseline="central" fill="#cfc8ff" font-size="14" font-weight="600">Browse</text>
<text x="340" y="426" text-anchor="middle" dominant-baseline="central" fill="#9890c8" font-size="12">covers · counts · tiers</text>
<rect x="190" y="486" width="300" height="56" rx="10" fill="#321f18" stroke="#c06a40"/>
<text x="340" y="508" text-anchor="middle" dominant-baseline="central" fill="#f0cbb8" font-size="14" font-weight="600">Actions</text>
<text x="340" y="526" text-anchor="middle" dominant-baseline="central" fill="#c2937a" font-size="12">copy tokenURI · mint</text>
<line x1="340" y1="142" x2="340" y2="178" stroke="#57606e" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="340" y1="242" x2="340" y2="278" stroke="#57606e" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="340" y1="342" x2="340" y2="378" stroke="#57606e" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="340" y1="442" x2="340" y2="478" stroke="#57606e" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>
