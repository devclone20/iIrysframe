<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 482" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img">
<title>iIrys Frame — Contracts</title>
<desc>O tab Contracts oferece três templates Solidity para a Base: iCLONE Royalty Agent (ERC-2981, 5%), Standard Agent (sem royalties) e Open Edition (mint público). Copia/descarrega o .sol, faz deploy na Base e cunha com mint(to, tokenURI) para obter o iNFT.</desc>
