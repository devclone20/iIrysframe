<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 462" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img">
<title>iIrys Frame — Soul</title>
<desc>O tab Soul: escolhe-se um preset (iCLONE, VEGETA, GOKU ou Custom), editam-se os campos da alma (nome, modelo base, system prompt, temperatura, voz), gera-se o ai_soul e este é injetado em metadata.ai_soul de cada NFT no seal.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#57606e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="461" rx="14" fill="#0b0e14" stroke="#1b2230"/>
<circle cx="44" cy="26" r="4" fill="#2bb88a"/>
<text x="56" y="30" fill="#eaf0f7" font-size="14" font-weight="600">Soul — configure the agent</text>
<text x="56" y="49" fill="#8b95a7" font-size="12">presets + fields → ai_soul, injected into every NFT</text>
<rect x="190" y="86" width="300" height="56" rx="10" fill="#1e1b37" stroke="#6a5fd0"/>
<text x="340" y="108" text-anchor="middle" dominant-baseline="central" fill="#cfc8ff" font-size="14" font-weight="600">Choose preset</text>
<text x="340" y="126" text-anchor="middle" dominant-baseline="central" fill="#9890c8" font-size="12">iCLONE · VEGETA · GOKU · Custom</text>
<rect x="190" y="186" width="300" height="56" rx="10" fill="#1e1b37" stroke="#6a5fd0"/>
<text x="340" y="208" text-anchor="middle" dominant-baseline="central" fill="#cfc8ff" font-size="14" font-weight="600">Edit soul</text>
<text x="340" y="226" text-anchor="middle" dominant-baseline="central" fill="#9890c8" font-size="12">name · model · prompt · temp · voice</text>
<rect x="190" y="286" width="300" height="56" rx="10" fill="#1e1b37" stroke="#6a5fd0"/>
<text x="340" y="308" text-anchor="middle" dominant-baseline="central" fill="#cfc8ff" font-size="14" font-weight="600">ai_soul</text>
<text x="340" y="326" text-anchor="middle" dominant-baseline="central" fill="#9890c8" font-size="12">the agent's identity</text>
<rect x="190" y="386" width="300" height="56" rx="10" fill="#161b24" stroke="#38414f"/>
<text x="340" y="408" text-anchor="middle" dominant-baseline="central" fill="#d3dae4" font-size="14" font-weight="600">Injected at seal</text>
<text x="340" y="426" text-anchor="middle" dominant-baseline="central" fill="#8a94a6" font-size="12">metadata.ai_soul per NFT</text>
<line x1="340" y1="142" x2="340" y2="178" stroke="#57606e" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="340" y1="242" x2="340" y2="278" stroke="#57606e" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="340" y1="342" x2="340" y2="378" stroke="#57606e" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>
