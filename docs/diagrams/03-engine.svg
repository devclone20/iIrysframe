<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 662" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img">
<title>iIrys Frame — Engine</title>
<desc>O tab Engine é um gerador estilo HashLips: define folders/traits (ordenados, required, overlay), pesos de raridade por variante, gera combinações com DNA único, compõe cada uma no canvas, mostra a galeria com rank de raridade e sela a coleção na Irys em lote.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#57606e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="661" rx="14" fill="#0b0e14" stroke="#1b2230"/>
<circle cx="44" cy="26" r="4" fill="#2bb88a"/>
<text x="56" y="30" fill="#eaf0f7" font-size="14" font-weight="600">Engine — generative collection</text>
<text x="56" y="49" fill="#8b95a7" font-size="12">HashLips-style generator → unique-DNA collection</text>
<rect x="190" y="86" width="300" height="56" rx="10" fill="#1e1b37" stroke="#6a5fd0"/>
<text x="340" y="108" text-anchor="middle" dominant-baseline="central" fill="#cfc8ff" font-size="14" font-weight="600">Folders / traits</text>
<text x="340" y="126" text-anchor="middle" dominant-baseline="central" fill="#9890c8" font-size="12">ordered · required · overlay</text>
<rect x="190" y="186" width="300" height="56" rx="10" fill="#1e1b37" stroke="#6a5fd0"/>
<text x="340" y="208" text-anchor="middle" dominant-baseline="central" fill="#cfc8ff" font-size="14" font-weight="600">Rarity weights</text>
<text x="340" y="226" text-anchor="middle" dominant-baseline="central" fill="#9890c8" font-size="12">% per variant</text>
<rect x="190" y="286" width="300" height="56" rx="10" fill="#1e1b37" stroke="#6a5fd0"/>
<text x="340" y="308" text-anchor="middle" dominant-baseline="central" fill="#cfc8ff" font-size="14" font-weight="600">generate()</text>
<text x="340" y="326" text-anchor="middle" dominant-baseline="central" fill="#9890c8" font-size="12">weighted pick · unique DNA</text>
<rect x="190" y="386" width="300" height="56" rx="10" fill="#1e1b37" stroke="#6a5fd0"/>
<text x="340" y="408" text-anchor="middle" dominant-baseline="central" fill="#cfc8ff" font-size="14" font-weight="600">Compose</text>
<text x="340" y="426" text-anchor="middle" dominant-baseline="central" fill="#9890c8" font-size="12">render combos on canvas</text>
<rect x="190" y="486" width="300" height="56" rx="10" fill="#1e1b37" stroke="#6a5fd0"/>
<text x="340" y="508" text-anchor="middle" dominant-baseline="central" fill="#cfc8ff" font-size="14" font-weight="600">Gallery</text>
<text x="340" y="526" text-anchor="middle" dominant-baseline="central" fill="#9890c8" font-size="12">rarity rank + score</text>
<rect x="190" y="586" width="300" height="56" rx="10" fill="#161b24" stroke="#38414f"/>
<text x="340" y="608" text-anchor="middle" dominant-baseline="central" fill="#d3dae4" font-size="14" font-weight="600">Seal to Irys</text>
<text x="340" y="626" text-anchor="middle" dominant-baseline="central" fill="#8a94a6" font-size="12">batch upload</text>
<line x1="340" y1="142" x2="340" y2="178" stroke="#57606e" stroke-width="1.5" marker-end="url(#ar)"/>
