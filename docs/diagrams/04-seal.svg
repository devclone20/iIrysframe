<text x="340" y="308" text-anchor="middle" dominant-baseline="central" fill="#f0cbb8" font-size="14" font-weight="600">Fund tx</text>
<text x="340" y="326" text-anchor="middle" dominant-baseline="central" fill="#c2937a" font-size="12">one up-front tx · Base ETH</text>
<rect x="190" y="386" width="300" height="56" rx="10" fill="#1e1b37" stroke="#6a5fd0"/>
<text x="340" y="408" text-anchor="middle" dominant-baseline="central" fill="#cfc8ff" font-size="14" font-weight="600">Batch upload</text>
<text x="340" y="426" text-anchor="middle" dominant-baseline="central" fill="#9890c8" font-size="12">tags: Collection · Type · Item · DNA</text>
