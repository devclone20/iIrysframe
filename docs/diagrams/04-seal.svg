<text x="340" y="508" text-anchor="middle" dominant-baseline="central" fill="#d3dae4" font-size="14" font-weight="600">Irys L1</text>
<text x="340" y="526" text-anchor="middle" dominant-baseline="central" fill="#8a94a6" font-size="12">permanent · gateway URL</text>
<rect x="190" y="586" width="300" height="56" rx="10" fill="#1e1b37" stroke="#6a5fd0"/>
<text x="340" y="608" text-anchor="middle" dominant-baseline="central" fill="#cfc8ff" font-size="14" font-weight="600">Receipts</text>
<text x="340" y="626" text-anchor="middle" dominant-baseline="central" fill="#9890c8" font-size="12">tokenURI · image · DNA + manifest</text>
