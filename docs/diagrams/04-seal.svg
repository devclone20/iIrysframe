<text x="340" y="208" text-anchor="middle" dominant-baseline="central" fill="#cfc8ff" font-size="14" font-weight="600">Summary + cost</text>
<text x="340" y="226" text-anchor="middle" dominant-baseline="central" fill="#9890c8" font-size="12">free &lt;100KiB · or ETH + USD</text>
