<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 662" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img">
<title>iIrys Frame — Seal to Irys</title>
<desc>O tab iIrys sela a coleção: a partir do staged (layers, finals, metadata), mostra resumo e custo (grátis abaixo de 100 KiB ou em ETH), faz uma transação de fund única, sobe tudo em lote com tags, grava na Irys permanente e devolve recibos com tokenURI e um manifest.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#57606e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="661" rx="14" fill="#0b0e14" stroke="#1b2230"/>
<circle cx="44" cy="26" r="4" fill="#2bb88a"/>
<text x="56" y="30" fill="#eaf0f7" font-size="14" font-weight="600">iIrys — seal to Irys</text>
<text x="56" y="49" fill="#8b95a7" font-size="12">summary → fund once → batch upload → receipts</text>
<rect x="190" y="86" width="300" height="56" rx="10" fill="#161b24" stroke="#38414f"/>
<text x="340" y="108" text-anchor="middle" dominant-baseline="central" fill="#d3dae4" font-size="14" font-weight="600">Staged</text>
<text x="340" y="126" text-anchor="middle" dominant-baseline="central" fill="#8a94a6" font-size="12">layers + finals + metadata</text>
