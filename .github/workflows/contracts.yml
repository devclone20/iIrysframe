name: Contracts CI

# Foundry build + tests for the ICloneAgent (iNFT) contract.
#
# This lives at the repo root on purpose: GitHub only runs workflows found in
# .github/workflows at the top level of the repository. The Foundry project
# itself is in contracts/ (run steps use it as their working directory); its
# dependencies (forge-std, OpenZeppelin, ERC721A) are pinned git submodules
# under contracts/lib and pulled with submodules: recursive.

permissions: {}

on:
  push:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: contracts

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        # Versão FIXA, não "stable". O `forge fmt` muda de regras entre versões:
        # com "stable" o CI reformata a régua debaixo dos pés e o `--check`
        # passa a falhar sozinho sem ninguém ter tocado no Solidity — foi o que
        # aconteceu aqui desde 13-07. v1.7.1 é a estável mais recente (08-05),
        # muito além da quarentena de 14 dias.
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv
