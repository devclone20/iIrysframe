name: Contracts CI

# Foundry build + tests for the ICloneAgent (iNFT) contract.
#
# This lives at the repo root on purpose: GitHub only runs workflows found in
# .github/workflows at the top level of the repository. The Foundry project
# itself is in contracts/ (run steps use it as their working directory); its
# dependencies (forge-std, OpenZeppelin, ERC721A) are pinned git submodules
# under contracts/lib and pulled with submodules: recursive.

permissions: {}

on:
  push:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: contracts

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv
